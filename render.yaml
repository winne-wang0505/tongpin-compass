services:
  - type: web
    name: tongpin-compass
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm install --global pnpm@11.19.0 && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm migrate:production && pnpm start
    healthCheckPath: /api/health
    disk:
      name: compass-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: APP_MODE
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/compass.sqlite
      - key: DELETION_JOURNAL
        value: /var/data/deletions.jsonl
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: OPERATOR_NAME
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: DEPLOYMENT_REGION
        sync: false
      - key: AI_MODE
        value: disabled
